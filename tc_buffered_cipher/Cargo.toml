[package]
name = "tc_buffered_cipher"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "One buffered interface over block modes with or without padding, stream ciphers and AEADs, after Bouncy Castle's IBufferedCipher."
readme = "README.md"
documentation = "https://docs.rs/tc_buffered_cipher"
keywords = ["cipher", "padding", "aead", "cryptography", "no-std"]
categories = ["cryptography", "no-std"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
alloc = ["tc_zeroize/alloc"]

[dependencies]
tc_aead_cipher = "0.1.0"
tc_block_cipher = "0.1.0"
tc_stream_cipher = "0.1.0"
tc_block_modes = "0.1.0"
tc_block_padding = "0.1.0"
tc_zeroize = "0.1.0"

[dev-dependencies]
tc_aes = "0.1.0"
tc_ascon_aead = "0.1.0"
tc_chacha = "0.1.0"
tc_block_modes = { version = "0.1.0", features = ["alloc"] }
